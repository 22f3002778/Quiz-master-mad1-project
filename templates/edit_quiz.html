{% extends 'admin_layout.html' %}

{% block admin_content %}
<h2 class="text-primary">Edit Quiz</h2>
<form method="POST">
    <div class="mb-3">
        <label class="form-label">Date of Quiz</label>
        <input type="date" name="date_of_quiz" class="form-control" value="{{ quiz.date_of_quiz }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Time Duration (HH:MM)</label>
        <input type="text" name="time_duration" class="form-control" value="{{ quiz.time_duration }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Remarks</label>
        <textarea name="remarks" class="form-control">{{ quiz.remarks }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('quiz_dashboard', name=name) }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
